# DHCP for pinchy-ap. DNS is switched off (port=0) so dnsmasq never contends
# with systemd-resolved, which already holds port 53 on this Pi.
port=0
interface=wlx00c0cab7c94c
bind-dynamic

dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,24h
# Isolated network: advertise no default route and no DNS server, so clients
# keep using their own internet path (cellular etc.) instead of black-holing here.
dhcp-option=3
dhcp-option=6
dhcp-authoritative
